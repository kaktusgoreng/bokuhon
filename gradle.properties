kotlin.code.style=official

# Locales the APK ships, as Android resource qualifiers. The rest are dropped from resources.arsc,
# and the in-app language list is generated from the same set.
locales=en,ms,ja,zh-rCN,zh-rTW

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
